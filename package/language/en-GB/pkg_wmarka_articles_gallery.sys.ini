PKG_WMARKA_ARTICLES_GALLERY="Webmarka: Gallery (UIkit 3) — package"
PKG_WMARKA_ARTICLES_GALLERY_XML_DESCRIPTION="The package installs the module "Webmarka: Gallery (UIkit 3)" and, when the site has none, the JUImage 5.21 library for WebP thumbnails. The module takes UIkit from the template, or from the jsDelivr CDN when the template has none."
PKG_WMARKA_ARTICLES_GALLERY_ERROR_PHP="PHP %s or later is required, the site runs %s."
PKG_WMARKA_ARTICLES_GALLERY_ERROR_JOOMLA="Joomla %s or later is required, the site runs %s."
PKG_WMARKA_ARTICLES_GALLERY_JUIMAGE_FOUND="JUImage %s is already installed: the package leaves it as it is."
PKG_WMARKA_ARTICLES_GALLERY_JUIMAGE_INSTALLED="The JUImage %s library is installed: the module will serve WebP thumbnails."
PKG_WMARKA_ARTICLES_GALLERY_JUIMAGE_FAILED="JUImage could not be installed. The module works without it but shows the original images."
PKG_WMARKA_ARTICLES_GALLERY_JUIMAGE_MISSING_ARCHIVE="The package has no JUImage archive. The module works without it but shows the original images."
PKG_WMARKA_ARTICLES_GALLERY_JUIMAGE_KEPT="The JUImage library stays on the site: the template and other extensions may use it."
PKG_WMARKA_ARTICLES_GALLERY_UIKIT_NOTE="The module takes UIkit from the template. When the page has none, UIkit 3.25.26 is loaded from the jsDelivr CDN; change this in the module options, Advanced tab."
